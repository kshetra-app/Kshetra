name: W021.5 Official Legal Order Probe

on:
  push:
    branches:
      - w0215-resumption-2026-10-25
    paths:
      - "scripts/acquire_w0215_eci_legal_order.py"
      - ".github/workflows/w0215-legal-order-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w0215-legal-order-probe
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire and extract official ECI 2008 order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorized W021.5 resumption branch
        uses: actions/checkout@v4
        with:
          ref: w0215-resumption-2026-10-25
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned acquisition and PDF parser
        run: python -m pip install --disable-pip-version-check "curl_cffi==0.13.0" "PyMuPDF==1.26.4"

      - name: Acquire PDF and extract Schedule III roster candidate
        run: python scripts/acquire_w0215_eci_legal_order.py

      - name: Upload raw PDF/error response, extracted text, roster and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-eci-legal-order-${{ github.run_id }}
          path: stage_b_legal_source/
          if-no-files-found: error
          retention-days: 30
