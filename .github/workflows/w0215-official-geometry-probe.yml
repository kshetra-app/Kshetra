name: W021.5 Official Geometry Probe

on:
  push:
    branches:
      - cto/w0215-stage-b-evidence-20261025
    paths:
      - "scripts/w0215_acquire_official_geometry.py"
      - "scripts/audit_w0215_telangana_candidate_geometry.py"
      - "scripts/compare_w0215_telangana_candidate_variants.py"
      - ".github/workflows/w0215-official-geometry-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w0215-official-geometry-probe
  cancel-in-progress: true

jobs:
  acquire:
    name: Fetch and structurally check official-source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout authorized W021.5 resumption branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned HTTP client
        run: python -m pip install --disable-pip-version-check "curl_cffi==0.13.0"

      - name: Acquire allowlisted source bytes and validate structure
        id: probe
        continue-on-error: true
        run: python scripts/w0215_acquire_official_geometry.py

      - name: Install pinned GIS audit dependency
        if: always()
        run: python -m pip install --disable-pip-version-check "shapely==2.1.2"

      - name: Run reproducible topology audit on acquired Telangana layers
        if: always()
        run: python scripts/audit_w0215_telangana_candidate_geometry.py

      - name: Compare acquired Telangana candidate geometry families
        if: always()
        run: python scripts/compare_w0215_telangana_candidate_variants.py

      - name: Upload raw responses and manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-official-geometry-probe-${{ github.run_id }}
          path: stage_b_acquisition/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce source probe result
        if: steps.probe.outcome != 'success'
        run: |
          echo "Official geometry probe failed or was partial; inspect raw responses and manifest."
          exit 1
