name: W021.5 Gazette and India Post Catalogue Expansion

on:
  push:
    branches:
      - cto/w0215-stage-b-evidence-20261025
    paths:
      - "scripts/explore_w0215_official_catalogues.py"
      - ".github/workflows/w0215-official-catalogue-expansion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w0215-official-catalogue-expansion
  cancel-in-progress: false

jobs:
  explore:
    name: Search official publication and postal data catalogues
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout authorized W021.5 evidence-only branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PDF and HTTP parsers
        run: python -m pip install --disable-pip-version-check "requests==2.32.5" "PyMuPDF==1.26.4"
      - name: Probe official catalogue pages and Wayback exact-directory indexes
        id: probe
        continue-on-error: true
        run: python scripts/explore_w0215_official_catalogues.py
      - name: Upload all manifests and any accepted source-candidate bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-official-catalogue-expansion-${{ github.run_id }}
          path: stage_b_catalogue_expansion/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist verified discovery records and matched raw bytes to evidence-only branch
        if: steps.probe.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/cto/w0215-stage-b-evidence-20261025"
          test -s stage_b_catalogue_expansion/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage_b_catalogue_expansion/
          if git diff --cached --quiet; then
            echo "No new catalogue artifacts to persist."
          else
            git commit -m "evidence(w0215): persist expanded Gazette and postal catalogue probe"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Enforce successful probe execution (not a data-availability assertion)
        if: steps.probe.outcome != 'success'
        run: |
          echo "Catalogue probe failed to execute or validate its manifest; inspect logs and uploaded artifacts."
          exit 1
