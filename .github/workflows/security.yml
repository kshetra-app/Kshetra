name: Security — SAST, SCA & SBOM

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  schedule:
    # Weekly supply-chain re-scan (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  sca:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: OSV Scanner
        uses: google/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/typescript
            p/react
            p/nodejsscan
            p/owasp-top-ten
            p/secrets

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --package-lock-only --validate --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
