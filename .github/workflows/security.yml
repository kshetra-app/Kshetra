name: Security — SAST, SCA & SBOM

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  schedule:
    # Weekly supply-chain re-scan (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependency tree
        run: npm audit --audit-level=high

  osv-scan:
    name: OSV dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (explicit rules, offline-friendly exit semantics)
        run: >-
          semgrep scan
          --config p/typescript
          --config p/react
          --config p/nodejsscan
          --config p/owasp-top-ten
          --config p/secrets
          --error


  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
