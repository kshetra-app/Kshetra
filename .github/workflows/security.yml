name: Security — SAST, SCA & SBOM

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: OSV Scanner
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.4.0 scan source -r .

  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/nodejsscan
            p/owasp-top-ten
            p/secrets

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: License policy gate
        shell: bash
        run: |
          set -euo pipefail
          # Kshetra is proprietary; dependency license grants must be explicitly reviewed.
          # Fail closed on unknown/guessed licenses and on copyleft or source-available
          # licenses needing legal review. Review findings and update this deny list only
          # through an approved license-policy change with legal sign-off.
          npx --yes license-checker@25.0.1 --production --unknown --failOn "GPL;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL;AGPL-3.0-only;AGPL-3.0-or-later;SSPL-1.0;BUSL-1.1;Commons-Clause;UNKNOWN" --summary
      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - name: Verify SBOM exists and is non-empty
        run: test -s sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
