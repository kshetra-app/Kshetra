name: EAS Build

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'data/seed/**'
      - 'scrapers/output/local-body/**'
      - 'scripts/build-seed-db.mjs'
      - 'scripts/validate-seed-db.mjs'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'all'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Materialize canonical local-body LFS inputs without fetching stale DB object
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include='scrapers/output/local-body/*.json' --exclude='apps/mobile/data/seed-data.db'
          shopt -s nullglob
          inputs=(scrapers/output/local-body/*.json)
          if ((${#inputs[@]} == 0)); then
            echo 'No canonical local-body JSON inputs found; seed database generation cannot be release-safe.' >&2
            exit 1
          fi
          for file in "${inputs[@]}"; do
            if head -c 80 "$file" | grep -q 'git-lfs.github.com/spec/v1'; then
              echo "Unmaterialized Git LFS pointer: $file" >&2
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kshetra/shared

      - name: Generate seed SQLite from canonical source inputs
        run: npm run build:seed-db

      - name: Validate generated seed database before remote build
        run: npm run validate:seed-db

      - name: Upload seed build evidence
        uses: actions/upload-artifact@v4
        with:
          name: seed-db-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/mobile/data/seed-manifest.json
            apps/mobile/data/seed-db-version.json

      - name: Run tests
        run: |
          npm test -w @kshetra/shared -- --passWithNoTests --forceExit
          npm test -w @kshetra/api -- --passWithNoTests --forceExit

      - name: Build (push)
        if: github.event_name == 'push'
        run: eas build --platform all --profile preview --non-interactive
        working-directory: apps/mobile

      - name: Build (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
        working-directory: apps/mobile
