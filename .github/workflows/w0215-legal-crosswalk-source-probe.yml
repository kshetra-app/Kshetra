name: W021.5 Official Legal Crosswalk Source Probe

on:
  push:
    branches:
      - cto/w0215-stage-b-evidence-20261025
    paths:
      - "scripts/acquire_w0215_legal_crosswalk_sources.py"
      - "scripts/parse_w0215_telangana_statutory_ac_roster.py"
      - ".github/workflows/w0215-legal-crosswalk-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w0215-legal-crosswalk-source-probe
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire official legal crosswalk source bytes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout authorized W021.5 resumption branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned acquisition and PDF parser
        run: python -m pip install --disable-pip-version-check "curl_cffi==0.13.0" "PyMuPDF==1.26.4"
      - name: Acquire official legal source bytes and write manifest
        id: acquisition
        continue-on-error: true
        run: python scripts/acquire_w0215_legal_crosswalk_sources.py
      - name: Parse statutory Telangana AC roster from acquired Gazette PDF
        id: roster
        if: always()
        continue-on-error: true
        run: python scripts/parse_w0215_telangana_statutory_ac_roster.py
      - name: Upload source bytes, extracted text, roster and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-legal-crosswalk-sources-${{ github.run_id }}
          path: stage_b_legal_crosswalk/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce required-source acquisition result
        if: steps.acquisition.outcome != 'success' || steps.roster.outcome != 'success'
        run: |
          echo "The required official legal source or statutory roster parse did not pass; inspect the uploaded manifest and parser report."
          exit 1
