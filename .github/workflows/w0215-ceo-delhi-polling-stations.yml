name: W021.5 Official CEO Delhi Polling Station Evidence

on:
  push:
    branches:
      - cto/w0215-stage-b-evidence-20261025
    paths:
      - "scripts/acquire_w0215_ceo_delhi_polling_stations.py"
      - "scripts/archive_w0215_delhi_polling_evidence.py"
      - ".github/workflows/w0215-ceo-delhi-polling-stations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w0215-ceo-delhi-polling-stations
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire official Delhi AC-to-polling-station source pages
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout authorized W021.5 Stage B evidence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned HTTP acquisition dependency
        run: python -m pip install --disable-pip-version-check "curl_cffi==0.13.0"
      - name: Acquire and validate official polling station pages
        id: acquisition
        continue-on-error: true
        run: python scripts/acquire_w0215_ceo_delhi_polling_stations.py
      - name: Build and independently verify lossless durable evidence package
        id: archive
        if: steps.acquisition.outcome == 'success'
        run: python scripts/archive_w0215_delhi_polling_evidence.py
      - name: Persist verified data package to authorized evidence branch
        if: steps.archive.outcome == 'success'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/heads/cto/w0215-stage-b-evidence-20261025"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/w021_5/delhi_2024/
          if git diff --cached --quiet; then
            echo "No durable evidence package changes to commit."
          else
            git commit -m "evidence(w0215): persist validated Delhi polling station crosswalk"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload source bytes, crosswalk and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-ceo-delhi-polling-stations-${{ github.run_id }}
          path: |
            stage_b_ceo_delhi_polling_stations/
            data/evidence/w021_5/delhi_2024/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce complete jurisdictional slice
        if: steps.acquisition.outcome != 'success'
        run: |
          echo "Delhi polling-station evidence is partial; review source-byte manifest and retain missing AC pages as open."
          exit 1
