name: W021.5 Official OGD PIN Boundary Resource Acquisition

on:
  push:
    branches:
      - cto/w0215-stage-b-evidence-20261025
    paths:
      - "scripts/acquire_w0215_ogd_pin_boundary_reference.py"
      - ".github/workflows/w0215-ogd-pin-boundary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w0215-ogd-pin-boundary
  cancel-in-progress: false

jobs:
  acquire:
    name: Discover and acquire the official PIN boundary resource
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout authorized evidence-only branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned resource and geometry audit dependencies
        run: python -m pip install --disable-pip-version-check "requests==2.32.5" "shapely==2.1.2"
      - name: Acquire official catalogue and inspect observed download routes
        id: probe
        continue-on-error: true
        run: |
          python -m py_compile scripts/acquire_w0215_ogd_pin_boundary_reference.py
          python scripts/acquire_w0215_ogd_pin_boundary_reference.py
      - name: Upload official responses and full provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0215-ogd-pin-boundary-${{ github.run_id }}
          path: stage_b_india_post_pin_boundary_probe/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist raw responses and acquisition manifest to evidence-only branch
        if: steps.probe.outcome == 'success'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/cto/w0215-stage-b-evidence-20261025"
          test -s stage_b_india_post_pin_boundary_probe/manifest.json
          mkdir -p data/evidence/w021_5/india_post_pin_boundary_candidate
          cp -R stage_b_india_post_pin_boundary_probe/. data/evidence/w021_5/india_post_pin_boundary_candidate/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/w021_5/india_post_pin_boundary_candidate/
          if git diff --cached --quiet; then
            echo "No changes to the candidate acquisition snapshot."
          else
            git commit -m "evidence(w0215): preserve OGD PIN boundary candidate acquisition"
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - name: Report an unsuccessful acquisition honestly
        if: steps.probe.outcome != 'success'
        run: |
          echo "Resource acquisition script failed; uploaded logs and any partial manifest are the evidence."
          exit 1
