name: CI — Lint & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kshetra/shared

      - name: Test shared package
        run: npm test -w @kshetra/shared -- --passWithNoTests --forceExit

      - name: Test API
        run: npm test -w @kshetra/api -- --passWithNoTests --forceExit

      - name: Test seed data
        run: npx jest --config jest.config.js --passWithNoTests --forceExit
        working-directory: data/seed

      - name: Test census data
        run: npx jest --config jest.config.js --passWithNoTests --forceExit
        working-directory: data/census

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @kshetra/shared

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore
