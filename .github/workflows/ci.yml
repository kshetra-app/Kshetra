name: CI — Lint, Test & Quality Pipeline

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance & Drift Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Governance Consistency
        run: node tests/governance-consistency.test.mjs

      - name: Verify Commit Freshness & Lineage
        run: node tests/commit-freshness.test.mjs

      - name: Audit Repository & Evidence Integrity (Part 34)
        run: node scripts/check-repo-evidence-integrity.mjs

      - name: "Regression Test: Evidence Integrity & Dirty-Tree Rejection"
        run: node tests/repo-evidence-integrity.test.mjs

      - name: Declared API Contract Drift Check (Part 34E)
        run: node scripts/check-api-contract-drift.mjs

      - name: Audit 13-Language i18n Parity (DEF-012 Monitoring)
        run: node scripts/verify-13-locales.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kshetra/shared

      - name: Test shared package
        run: npm test -w @kshetra/shared -- --forceExit

      - name: Test Environment Separation
        run: npx tsx tests/environment-separation.test.mjs
        env:
          NODE_ENV: test

      - name: Test API (with coverage gate)
        run: npm run test:coverage -w @kshetra/api
        env:
          SUPABASE_URL: https://test-fixture.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoxOTAwMDAwMDAwfQ.dummy_signature_for_test_environment_only

      - name: Start isolated PostgreSQL 16 and apply the exact W022 migration chain
        run: |
          docker run -d --name w022-verify-postgres \
            -e POSTGRES_USER=w022_admin \
            -e POSTGRES_PASSWORD=w022_local_only \
            -e POSTGRES_DB=w022_disposable_db \
            -p 127.0.0.1:54333:5432 postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec w022-verify-postgres pg_isready -U w022_admin -d w022_disposable_db; then break; fi
            sleep 1
          done
          docker exec w022-verify-postgres psql -U w022_admin -d w022_disposable_db -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          for migration in \
            supabase/migrations/056_saas_partner_foundation.sql \
            supabase/migrations/057_w021_saas_tenant_isolation_remediation.sql \
            supabase/migrations/058_w021_saas_atomic_quota_enforcement.sql \
            supabase/migrations/070_saas_webhook_engine.sql \
            supabase/migrations/071_w022_atomic_event_dispatch_and_worker_security.sql; do
            echo "Applying exact source migration: $migration"
            docker exec -i w022-verify-postgres psql -U w022_admin -d w022_disposable_db -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Test W022 atomic queue and worker security contracts
        run: npm run test:w022 -w @kshetra/api
        env:
          NODE_ENV: test
          WEBHOOK_SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPABASE_URL: https://test-fixture.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoxOTAwMDAwMDAwfQ.dummy_signature_for_test_environment_only

      - name: Verify W022 against disposable PostgreSQL 16
        run: npx tsx tests/webhooks-real-postgres-verification.test.ts
        env:
          W022_TEST_DB: w022_disposable_db

      - name: Test seed data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/seed

      - name: Test census data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/census

      - name: Test mobile (node-safe lib units)
        run: npm test -w @kshetra/mobile -- --forceExit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @kshetra/shared

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Typecheck shared
        run: npx tsc --noEmit
        working-directory: packages/shared

      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore
        continue-on-error: true

      - name: ESLint
        run: npx eslint "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" --max-warnings=0
        continue-on-error: true
