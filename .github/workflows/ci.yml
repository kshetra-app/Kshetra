name: CI — Lint, Test & Quality Pipeline

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis-delimitation:
    name: PostGIS Geography and Delimitation Fixtures
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: poligram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poligram_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compare PostGIS operations with attributed canonical fixture
        run: npx tsx tests/postgis-authoritative-delimitation.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:test_password@localhost:5432/poligram_test

      - name: Validate version-bound boundary loading and persisted certification
        run: npx tsx tests/postgis-version-bound-geography.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:test_password@localhost:5432/poligram_test

  governance:
    name: Governance & Drift Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Governance Consistency
        run: node tests/governance-consistency.test.mjs

      - name: Verify Commit Freshness & Lineage
        run: node tests/commit-freshness.test.mjs

      - name: Audit Repository & Evidence Integrity (Part 34)
        run: node scripts/check-repo-evidence-integrity.mjs

      - name: 'Regression Test: Evidence Integrity & Dirty-Tree Rejection'
        run: node tests/repo-evidence-integrity.test.mjs

      - name: Declared API Contract Drift Check (Part 34E)
        run: node scripts/check-api-contract-drift.mjs

      - name: Audit 13-Language i18n Parity (DEF-012 Monitoring)
        run: node scripts/verify-13-locales.mjs

      - name: Verify 13-Language Semantic & Bidirectional Token Integrity (DEF-012 Gate)
        run: node scripts/verify-locale-semantic-integrity.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kshetra/shared

      - name: Test shared package
        run: npm test -w @kshetra/shared -- --forceExit

      - name: Test Environment Separation
        run: npx tsx tests/environment-separation.test.mjs
        env:
          NODE_ENV: test

      - name: Test API (with coverage gate)
        run: npm run test:coverage -w @kshetra/api -- --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_URL: https://test-fixture.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoxOTAwMDAwMDAwfQ.dummy_signature_for_test_environment_only

      - name: Test seed data
        run: npx jest --config jest.config.js --forceExit --maxWorkers=2
        working-directory: data/seed
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test census data
        run: npx jest --config jest.config.js --forceExit --maxWorkers=2
        working-directory: data/census
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test mobile (node-safe lib units)
        run: npm test -w @kshetra/mobile -- --forceExit --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @kshetra/shared

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck shared
        run: npx tsc --noEmit
        working-directory: packages/shared

      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

      - name: Typecheck seed data
        run: npx tsc --noEmit -p data/seed/tsconfig.json

      - name: Typecheck census data
        run: npx tsc --noEmit -p data/census/tsconfig.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" --ignore-path .prettierignore

      - name: ESLint
        run: npx eslint "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" --quiet
