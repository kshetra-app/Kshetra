name: CI — Lint, Test & Quality Pipeline

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance & Drift Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Governance Consistency
        run: node tests/governance-consistency.test.mjs

      - name: Audit Migration Drift (Part 7 & 8)
        run: node scripts/check-migration-drift.mjs

      - name: Audit Repository & Evidence Integrity (Part 34)
        run: node scripts/check-repo-evidence-integrity.mjs

      - name: Audit API Contract Drift (Part 34E)
        run: node scripts/check-api-contract-drift.mjs

      - name: Audit 13-Language i18n Parity (DEF-012 Monitoring)
        run: node scripts/verify-13-locales.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @kshetra/shared

      - name: Test shared package
        run: npm test -w @kshetra/shared -- --forceExit

      - name: Test Environment Separation
        run: npx tsx tests/environment-separation.test.mjs
        env:
          NODE_ENV: test

      - name: Test API (with coverage gate)
        run: npm run test:coverage -w @kshetra/api -- --forceExit

      - name: Test seed data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/seed

      - name: Test census data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/census

      - name: Test mobile (node-safe lib units)
        run: npm test -w @kshetra/mobile -- --forceExit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @kshetra/shared

      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Typecheck shared
        run: npx tsc --noEmit
        working-directory: packages/shared

      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore
        continue-on-error: true

      - name: ESLint
        run: npx eslint "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" --max-warnings=0
        continue-on-error: true
