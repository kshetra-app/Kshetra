name: CI — Lint, Test & Quality Pipeline

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel active release gates while a newer commit queues; every attempted revision must finish verification.
  cancel-in-progress: false

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci

  governance:
    name: Governance & Drift Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Governance Consistency
        run: node tests/governance-consistency.test.mjs
      - name: Verify Commit Freshness & Lineage
        run: node tests/commit-freshness.test.mjs
      - name: Audit Repository & Evidence Integrity
        run: node scripts/check-repo-evidence-integrity.mjs
      - name: Regression Test — Evidence Integrity & Dirty-Tree Rejection
        run: node tests/repo-evidence-integrity.test.mjs
      - name: Declared API Contract Drift Check
        run: node scripts/check-api-contract-drift.mjs
      - name: Audit 13-Language i18n Parity
        run: node scripts/verify-13-locales.mjs --strict

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build -w @kshetra/shared
      - name: Test shared package
        run: npm test -w @kshetra/shared -- --forceExit
      - name: Test Environment Separation
        run: npx tsx tests/environment-separation.test.mjs
        env:
          NODE_ENV: test
      - name: Test API (with coverage gate)
        run: npm run test:coverage -w @kshetra/api
        env:
          SUPABASE_URL: https://test-fixture.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL3Rlc3QuZXhhbXBsZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoxOTAwMDAwMDAwfQ.test_fixture_only
      - name: Test seed data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/seed
      - name: Test census data
        run: npx jest --config jest.config.js --forceExit
        working-directory: data/census
      - name: Test mobile (node-safe lib units)
        run: npm test -w @kshetra/mobile -- --forceExit

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Typecheck shared
        run: npx tsc --noEmit
        working-directory: packages/shared
      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,json,md}" --ignore-path .gitignore
      - name: ESLint
        run: npx eslint "apps/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" --max-warnings=0

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Declared API Contract Drift Check
        run: node scripts/check-api-contract-drift.mjs

  evidence-integrity:
    name: Evidence Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Repository Evidence Integrity
        run: node scripts/check-repo-evidence-integrity.mjs
      - name: Evidence Integrity Negative-Path Regression
        run: node tests/repo-evidence-integrity.test.mjs


  release-gate-regression:
    name: Release Gate Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CI release-gate negative-path regression tests
        run: node tests/ci-release-gates.test.mjs
