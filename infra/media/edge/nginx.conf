# Nginx EDGE — HLS caching + CORS (so browser players & P2P Media Loader can pull
# segments) + a single reverse-proxy front for the broadcast/low-latency tiers.
# This is the self-hosted "CDN edge"; deploy N of these across regions in front of
# the SRS origin. Docs: add TLS (certbot) and rate-limits for production.

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # HLS segment cache (offload the origin). 10s for the playlist, 60s for segments.
    proxy_cache_path /tmp/hls_cache levels=1:2 keys_zone=hls:50m max_size=2g
                     inactive=120s use_temp_path=off;

    # Shared CORS for every media response (required by hls.js + P2P Media Loader).
    map $request_method $cors_method { OPTIONS 204; default 200; }

    upstream srs_origin { server srs:8080; }   # HLS / HTTP-FLV
    upstream ome_llhls  { server ome:3334; }    # LL-HLS

    server {
        listen 80;
        server_name _;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        if ($request_method = OPTIONS) { return 204; }

        # ── TIER 2: SRS broadcast HLS  ->  /live/<streamId>.m3u8 ──────────────
        location /live/ {
            proxy_pass http://srs_origin;
            proxy_cache hls;
            proxy_cache_valid 200 10s;               # playlists refresh fast
            location ~* \.ts$ { proxy_pass http://srs_origin; proxy_cache hls; proxy_cache_valid 200 60s; }
            proxy_set_header Host $host;
        }

        # ── TIER 1: OME LL-HLS  ->  /llhls/app/<streamId>/llhls.m3u8 ─────────
        location /llhls/ {
            rewrite ^/llhls/(.*)$ /$1 break;
            proxy_pass http://ome_llhls;
            proxy_set_header Host $host;
            proxy_buffering off;                     # keep low latency intact
        }

        location = /healthz { return 200 "ok\n"; }
    }
}
