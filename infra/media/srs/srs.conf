# SRS 5 — TIER 2 scalable broadcast origin: RTMP in -> HLS + HTTP-FLV + WebRTC(WHEP),
# with DVR (recording) and edge-clustering support for a self-hosted CDN.
# Docs: https://ossrs.io

listen              1935;          # RTMP ingest (from MediaMTX relay, internal)
max_connections     4000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;          # serves /live/<stream>.m3u8 + DVR + player
    dir             ./objs/nginx/html;
    # CORS so the browser HLS player (and P2P Media Loader) can fetch segments.
    crossdomain     on;
}

# WebRTC (WHEP) playback for the low-latency path when SRS is used directly.
rtc_server {
    enabled         on;
    listen          8000;          # UDP
    # candidate must be the PUBLIC ip in production:
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {

    # ── HLS output (CDN-friendly, ~4-6s; the default public path) ───────────
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      12;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # ── HTTP-FLV (lower latency than HLS, still HTTP) ────────────────────────
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # ── WebRTC (sub-second) — RTMP is transmuxed to WebRTC automatically ─────
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }

    # ── DVR: keep a raw recording of every stream (audit / archive) ──────────
    dvr {
        enabled      on;
        dvr_path     ./objs/nginx/html/dvr/[app]/[stream].[timestamp].flv;
        dvr_plan     session;
    }

    # ── Edge clustering ──────────────────────────────────────────────────────
    # Deploy additional SRS nodes with `cluster { mode remote; origin srs; }` to
    # fan out to regions — that is the self-hosted CDN. This node is the origin.
    play    { gop_cache on; }
    publish { }
}
