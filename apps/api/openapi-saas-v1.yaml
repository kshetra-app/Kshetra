        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      operationId: createApiKey
      tags:
        - Onboarding & Key Management
      summary: Generate a new cryptographic API key
      description: Generates a new 256-bit CSPRNG API key adhering to RFC 4648 Base64URL unpadded construction. The raw secret is returned exactly once in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaasApiKeyCreateRequest'
      responses:
        '201':
          description: Cryptographic API key generated successfully.
          content:
