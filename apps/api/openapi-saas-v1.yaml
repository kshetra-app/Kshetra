          type: string
          example: p1111111-1111-1111-1111-111111111111
        canonicalName:
          type: string
          example: Anumula Revanth Reddy
        aliases:
          type: array
          items:
            type: string
          example: [Revanth Reddy]
        gender:
          type: string
          nullable: true
          example: male
        photoUrl:
          type: string
          nullable: true
        eciCandidateId:
          type: string
          nullable: true
          example: ECI-1234
        sansadMemberId:
          type: string
          nullable: true
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    CanonicalPersonProfile:
      type: object
      required:
        - id
        - canonicalName
        - provenance
      properties:
        id:
          type: string
          example: p1111111-1111-1111-1111-111111111111
        canonicalName:
          type: string
          example: Anumula Revanth Reddy
        aliases:
          type: array
          items:
            type: string
        gender:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        eciCandidateId:
          type: string
          nullable: true
        sansadMemberId:
          type: string
          nullable: true
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    CanonicalOrgSummary:
      type: object
      required:
        - id
        - name
        - provenance
      properties:
