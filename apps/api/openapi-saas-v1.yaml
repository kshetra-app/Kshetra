          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/billing/verify:
    post:
      operationId: verifyBillingPayment
      tags:
        - Commercial Subscriptions & Billing
      summary: Verify payment signature and upgrade tenant subscription
      description: Verifies cryptographic payment HMAC signature and upgrades tenant tier in PostgreSQL with expanded burst limit and monthly quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaasBillingVerifyRequest'
      responses:
        '200':
          description: Payment verified and tenant tier upgraded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SaasBillingVerifyResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/billing/webhook:
    post:
      operationId: receiveBillingWebhook
      tags:
        - Commercial Subscriptions & Billing
      summary: Inbound payment provider webhook
      description: Receives asynchronous events (e.g. payment.captured, subscription.charged) signed with payment provider HMAC secret.
      security: []
      responses:
        '200':
          description: Webhook received and processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  event:
                    type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/vsaas/v1/account/usage:
    get:
      operationId: getUsageSummary
      tags:
        - Usage & Telemetry
      summary: Real-time quota usage and telemetry metrics
      description: Aggregates durable usage from public.saas_usage_ledger, returning remaining monthly quota percentage and 24-hour hourly trend.
      responses:
        '200':
          description: Quota telemetry successfully retrieved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SaasUsageSummaryResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/docs:
    get:
      operationId: getDeveloperPortal
      tags:
        - Developer Portal & API Specs
      summary: Futuristic developer portal HTML
      description: Interactive documentation web portal with integrated live API playground, SDK installation guides, and plan comparisons.
      security: []
      responses:
        '200':
          description: HTML developer portal rendered.
          content:
            text/html:
              schema:
                type: string

  /api/vsaas/v1/openapi.json:
    get:
      operationId: getOpenApiJson
      tags:
        - Developer Portal & API Specs
      summary: Machine-readable OpenAPI 3.1 specification (JSON)
      description: Returns the complete OpenAPI 3.1 specification formatted as JSON.
      security: []
      responses:
        '200':
          description: OpenAPI JSON specification.
          content:
            application/json:
              schema:
                type: object

  /api/vsaas/v1/openapi.yaml:
    get:
      operationId: getOpenApiYaml
      tags:
        - Developer Portal & API Specs
      summary: Machine-readable OpenAPI 3.1 specification (YAML)
      description: Returns the complete OpenAPI 3.1 specification formatted as YAML.
      security: []
      responses:
        '200':
          description: OpenAPI YAML specification.
          content:
            text/yaml:
              schema:
                type: string

components:
  # ════════════════════════════════════════════════════════════════════════════
  # SECURITY SCHEMES
  # ════════════════════════════════════════════════════════════════════════════
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Primary cryptographic API key header.
        Accepted formats strictly follow the 57-character pattern:
          - panin_live_sk_<43-char Base64URL secret> (Production live key)
          - panin_test_sk_<43-char Base64URL secret> (Testing / sandbox key)
        Regex pattern: ^panin_(live|test)_sk_[0-9a-zA-Z_-]{43}$
        CRITICAL: Prefixes starting with 'kshetra_live_', 'kshetra_test_', or unauthorized aliases are strictly REJECTED with 401 UNAUTHORIZED.

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: panin_api_key
      description: >
        Standard Authorization Bearer token header.
        Value must be the exact raw API key:
          Authorization: Bearer panin_live_sk_<43 chars>
          Authorization: Bearer panin_test_sk_<43 chars>
        Regex pattern: ^panin_(live|test)_sk_[0-9a-zA-Z_-]{43}$
        CRITICAL: Prefixes starting with 'kshetra_live_', 'kshetra_test_', or unauthorized aliases are strictly REJECTED with 401 UNAUTHORIZED.

  # ════════════════════════════════════════════════════════════════════════════
  # COMMON RESPONSE HEADERS
  # ════════════════════════════════════════════════════════════════════════════
  headers:
    XRequestId:
      schema:
        type: string
        format: uuid
      description: Unique correlation identifier generated or echoed by the API gateway.
    XResponseTime:
      schema:
        type: string
        example: 4.12ms
      description: Total server-side execution duration in milliseconds.
    XRatelimitLimit:
      schema:
        type: integer
        example: 600
      description: Maximum permitted requests in the current burst minute window.
    XRatelimitRemaining:
      schema:
        type: integer
        example: 599
      description: Remaining burst requests available in the current minute window.
    XRatelimitReset:
      schema:
        type: integer
        example: 45
      description: Seconds until the current burst rate-limit window resets.
    XMonthlyQuotaLimit:
      schema:
        type: integer
        example: 500000
      description: Durable tenant monthly ledger request ceiling based on subscription tier.
    XMonthlyQuotaRemaining:
      schema:
        type: integer
        example: 499958
      description: Remaining durable requests available in the current monthly billing period.

  # ════════════════════════════════════════════════════════════════════════════
  # COMMON PARAMETERS
  # ════════════════════════════════════════════════════════════════════════════
  parameters:
    StateCodePathParam:
      name: stateCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z]{2}$'
        example: TS
      description: Standard 2-letter state code (case-insensitive; e.g. TS, TG for Telangana).

    AcNoPathParam:
      name: acNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 65
      description: Official assembly constituency number (acNo >= 1).

    EntityIdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Canonical entity identifier (UUID or stable domain code).

    LimitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: Number of records to return per page (1 to 50, default 20).

    OffsetQueryParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of records to skip for pagination (default 0).

  # ════════════════════════════════════════════════════════════════════════════
  # RESPONSES
  # ════════════════════════════════════════════════════════════════════════════
  responses:
    400BadRequest:
      description: Request parameter validation failed or forbidden scenario override attempted.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-response-time:
          $ref: '#/components/headers/XResponseTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          examples:
            validationError:
              summary: Parameter validation failure
              value:
                error: Bad Request
                message: params/acNo must be >= 1
                statusCode: 400
                requestId: 81961fae-b2d9-43c2-a9ae-dfd8076db4f6
                timestamp: '2026-10-02T12:00:00.000Z'
            scenarioForbidden:
              summary: Client-supplied scenario override rejected
              value:
                error: Bad Request
                message: Direct provision or override of isScenario or simulation boolean is strictly forbidden. Provenance is derived exclusively by the server.
                code: SCENARIO_INPUT_FORBIDDEN
                statusCode: 400
                requestId: c18da571-04bd-44ad-ab87-0b73cce4eb93
                timestamp: '2026-10-02T12:00:00.000Z'

    401Unauthorized:
      description: Missing, malformed, inactive, expired, or disallowed API key credentials.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-response-time:
          $ref: '#/components/headers/XResponseTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error: Unauthorized
            message: Invalid or inactive API key provided.
            code: UNAUTHORIZED
            statusCode: 401
            requestId: a31b6e6f-fb94-43cb-b092-297eb06fe8ec
            timestamp: '2026-10-02T12:00:00.000Z'

    404NotFound:
      description: The requested resource, constituency, or entity does not exist.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-response-time:
          $ref: '#/components/headers/XResponseTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error: Not Found
            message: State with code 'ZZ' is not supported or not found.
            code: STATE_NOT_FOUND
            statusCode: 404
            requestId: 2b037617-1f1d-4091-a1e6-239aa8067b45
            timestamp: '2026-10-02T12:00:00.000Z'

    429TooManyRequests:
      description: Rate limit exceeded (in-memory burst limit or PostgreSQL monthly quota ceiling).
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-response-time:
          $ref: '#/components/headers/XResponseTime'
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit window resets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error: Too Many Requests
            message: Rate limit exceeded. Please retry after the designated cooldown window.
            code: RATE_LIMIT_EXCEEDED
            statusCode: 429
            requestId: d1274941-eeef-4e31-8ca3-36aa3664d990
            timestamp: '2026-10-02T12:00:00.000Z'

    500InternalError:
      description: Internal server error or upstream database dependency failure.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-response-time:
          $ref: '#/components/headers/XResponseTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'
          example:
            error: Internal Server Error
            message: An unexpected error occurred. Please try again later.
            code: AUTH_DEPENDENCY_FAILURE
            statusCode: 500
            requestId: e055679f-6e8d-4e92-b43e-a61250280eb4
            timestamp: '2026-10-02T12:00:00.000Z'

  # ════════════════════════════════════════════════════════════════════════════
  # SCHEMAS
  # ════════════════════════════════════════════════════════════════════════════
  schemas:
    # ─── CANONICAL ENVELOPES ───
    ApiSuccessEnvelope:
      type: object
      required:
        - success
        - data
        - requestId
        - timestamp
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          description: The payload returned by the specific endpoint.
        requestId:
          type: string
          format: uuid
          example: 6a66a1a1-9a77-4b71-bdfc-8c1cb27f0001
        timestamp:
          type: string
          format: date-time
          example: '2026-10-02T12:00:00.000Z'

    ApiErrorEnvelope:
      type: object
      required:
        - error
        - message
        - statusCode
        - requestId
        - timestamp
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Invalid state code provided.
        statusCode:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        requestId:
          type: string
          format: uuid
          example: 8b88b2b2-0b88-5c82-cefd-9d2dc38f0002
        timestamp:
          type: string
          format: date-time
          example: '2026-10-02T12:00:00.000Z'
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

    # ─── PROVENANCE OBJECTS ───
    StatutoryFactProvenance:
      type: object
      description: >
        Authoritative statutory backing block. Certifies that the primary public records originate from official
        statutory authorities, legal orders, or gazette filings. Individual response properties contain mixed
        provenance (Statutory Facts, Derived Metrics, Current-State/Temporal Affiliations, Normalized Entities,
        and Synthetic Identifiers) as documented explicitly on each schema property.
      required:
        - authorityLayer
        - dataStatus
        - sourceReference
      properties:
        authorityLayer:
          type: string
          enum: [STATUTORY_FACT]
          description: Declares the statutory authority backing layer for the originating dataset.
          example: STATUTORY_FACT
        dataStatus:
          type: string
          enum: [OFFICIAL]
          description: Declares the official governance status of the originating source.
          example: OFFICIAL
        sourceReference:
          type: string
          description: Exact statutory order, gazette publication, or constitutional schedule reference.
          example: ECI Schedule XXXI / Delimitation of Parliamentary and Assembly Constituencies Order, 2008

    PaninScenarioProvenance:
      type: object
      required:
        - authorityLayer
        - computationalType
        - officialDelimitationOrder
        - governingInstrument
        - constitutionalBasis
        - legalStatus
        - sourceReference
        - statutoryDisclaimer
      properties:
        authorityLayer:
          type: string
          enum: [PANIN_SCENARIO]
          example: PANIN_SCENARIO
        computationalType:
          type: string
          enum: [ACADEMIC_SIMULATION]
          example: ACADEMIC_SIMULATION
        officialDelimitationOrder:
          type: boolean
          enum: [false]
          example: false
        governingInstrument:
          type: string
          example: PANIN Algorithmic Simulation (Article 170 Framework)
        constitutionalBasis:
          type: string
          example: Article 170(1)
        legalStatus:
          type: string
          enum: [SCENARIO_PROPOSED_REGIME]
          example: SCENARIO_PROPOSED_REGIME
        sourceReference:
          type: string
          example: Census 2011 Primary Census Abstract (RGI)
        effectiveVersion:
          type: string
          example: 2026-PANIN-SIM-V1
        generatedAt:
          type: string
          format: date-time
        statutoryDisclaimer:
          type: string
          example: This projection is a research simulation based on Census 2011 data and mathematical modeling. It does NOT represent an official order, draft proposal, or gazette notification of the Delimitation Commission of India or the Election Commission of India.

    # ─── GEOGRAPHY ENTITIES ───
    StateListItem:
      type: object
      required:
        - stateCode
        - name
        - totalSeats
        - loadedConstituencies
        - provenance
      properties:
        stateCode:
          type: string
          description: Canonical 2-letter state code per ECI / ISO 3166-2:IN [Official Statutory Fact].
          example: TS
        name:
          type: string
          description: Official state name per First Schedule of Constitution of India [Official Statutory Fact].
          example: Telangana
        totalSeats:
          type: integer
          description: Constitutional Assembly seat allocation per Delimitation Order, 2008 [Official Statutory Fact].
          example: 119
        loadedConstituencies:
          type: integer
          description: Count of constituencies currently indexed in the system catalog [Derived Metric].
          example: 119
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    StateDetail:
      type: object
      required:
        - stateCode
        - name
        - totalSeats
        - loadedConstituencies
        - hasSpatialBoundaries
        - provenance
      properties:
        stateCode:
          type: string
          description: Canonical 2-letter state code per ECI / ISO 3166-2:IN [Official Statutory Fact].
          example: TS
        name:
          type: string
          description: Official state name per First Schedule of Constitution of India [Official Statutory Fact].
          example: Telangana
        totalSeats:
          type: integer
          description: Constitutional Assembly seat allocation per Delimitation Order, 2008 [Official Statutory Fact].
          example: 119
        loadedConstituencies:
          type: integer
          description: Count of constituencies currently indexed in the system catalog [Derived Metric].
          example: 119
        hasSpatialBoundaries:
          type: boolean
          description: Indicator of indexed spatial boundary GeoJSON availability [Derived Metric].
          example: true
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    ConstituencySummary:
      type: object
      required:
        - id
        - acNo
        - name
        - stateCode
        - district
        - reservationStatus
        - provenance
      properties:
        id:
          type: string
          description: Canonical synthetic system identifier (e.g. TS-AC-65) [Synthetic Identifier].
          example: TS-AC-65
        acNo:
          type: integer
          description: Statutory Assembly Constituency number assigned by Delimitation Commission [Official Statutory Fact].
          example: 65
        name:
          type: string
          description: Official Assembly Constituency name per Delimitation Order [Official Statutory Fact].
          example: Goshamahal
        stateCode:
          type: string
          description: State code jurisdiction per First Schedule of Constitution / ISO [Official Statutory Fact].
          example: TS
        district:
          type: string
          description: Official district jurisdiction per Gazette Notification [Official Statutory Fact].
          example: Hyderabad
        reservationStatus:
          type: string
          enum: [GEN, SC, ST]
          description: Constitutional reservation status under Article 332 [Official Statutory Fact].
          example: GEN
        currentParty:
          type: string
          nullable: true
          description: Political party affiliation of sitting MLA resolved at query time [Current-State / Temporal Affiliation].
          example: BJP
        currentMLA:
          type: string
          nullable: true
          description: Gazetted name of currently serving sitting MLA [Current-State / Incumbent].
          example: T. Raja Singh
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    ConstituencyDetail:
      type: object
      required:
        - id
        - acNo
        - name
        - stateCode
        - district
        - reservationStatus
        - provenance
      properties:
        id:
          type: string
          description: Canonical synthetic system identifier (e.g. TS-AC-65) [Synthetic Identifier].
          example: TS-AC-65
        acNo:
          type: integer
          description: Statutory Assembly Constituency number assigned by Delimitation Commission [Official Statutory Fact].
          example: 65
        name:
          type: string
          description: Official Assembly Constituency name per Delimitation Order [Official Statutory Fact].
          example: Goshamahal
        stateCode:
          type: string
          description: State code jurisdiction per First Schedule of Constitution / ISO [Official Statutory Fact].
          example: TS
        district:
          type: string
          description: Official district jurisdiction per Gazette Notification [Official Statutory Fact].
          example: Hyderabad
        reservationStatus:
          type: string
          enum: [GEN, SC, ST]
          description: Constitutional reservation status under Article 332 [Official Statutory Fact].
          example: GEN
        currentParty:
          type: string
          nullable: true
          description: Political party affiliation of sitting MLA resolved at query time [Current-State / Temporal Affiliation].
          example: BJP
        currentMLA:
          type: string
          nullable: true
          description: Gazetted name of currently serving sitting MLA [Current-State / Incumbent].
          example: T. Raja Singh
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    # ─── ELECTIONS ENTITIES ───
    ElectionEvent:
      type: object
      required:
        - id
        - electionCode
        - name
        - electionType
        - house
        - stateCode
        - status
        - provenance
      properties:
        id:
          type: string
          description: Internal synthetic primary key for the election event [Synthetic Identifier].
          example: e1111111-1111-1111-1111-111111111111
        electionCode:
          type: string
          description: Curated standardized election code [Normalized Entity].
          example: AE_TG_2023
        name:
          type: string
          description: Standardized descriptive name for the election event [Normalized Entity].
          example: Telangana Legislative Assembly General Election 2023
        electionType:
          type: string
          description: Statutory election category (e.g. general, bye) [Official Statutory Fact].
          example: general
        house:
          type: string
          description: Legislative body under Indian Constitution (e.g. assembly, lok_sabha) [Official Statutory Fact].
          example: assembly
        stateCode:
          type: string
          description: State jurisdiction code [Official Statutory Fact].
          example: TG
        notificationDate:
          type: string
          nullable: true
          description: Statutory gazette notification date per ECI schedule [Official Statutory Fact].
        pollDate:
          type: string
          nullable: true
          description: Date of polling per ECI schedule [Official Statutory Fact].
        countingDate:
          type: string
          nullable: true
          description: Date of counting per ECI schedule [Official Statutory Fact].
        completionDate:
          type: string
          nullable: true
          description: Statutory date before which election shall be completed [Official Statutory Fact].
        status:
          type: string
          description: Operational lifecycle status of the election event [Normalized Entity].
          example: completed
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    ElectionEventDetail:
      type: object
      required:
        - id
        - electionCode
        - name
        - electionType
        - house
        - stateCode
        - status
        - provenance
      properties:
        id:
          type: string
          description: Internal synthetic primary key for the election event [Synthetic Identifier].
          example: e1111111-1111-1111-1111-111111111111
        electionCode:
          type: string
          description: Curated standardized election code [Normalized Entity].
          example: AE_TG_2023
        name:
          type: string
          description: Standardized descriptive name for the election event [Normalized Entity].
          example: Telangana Legislative Assembly General Election 2023
        electionType:
          type: string
          description: Statutory election category [Official Statutory Fact].
          example: general
        house:
          type: string
          description: Legislative body under Indian Constitution [Official Statutory Fact].
          example: assembly
        stateCode:
          type: string
          description: State jurisdiction code [Official Statutory Fact].
          example: TG
        totalSeats:
          type: integer
          description: Total statutory assembly seats in the election event [Official Statutory Fact].
          example: 119
        totalVoters:
          type: integer
          description: Total registered electors per ECI Statistical Report [Official Statutory Fact].
          example: 32602793
        votesPolled:
          type: integer
          description: Total valid and invalid votes polled per ECI Statistical Report [Official Statutory Fact].
          example: 23298234
        turnoutPercentage:
          type: number
          description: Turnout percentage computed as (votesPolled / totalVoters * 100) [Derived Metric].
          example: 71.46
        status:
          type: string
          description: Operational lifecycle status of the election event [Normalized Entity].
          example: completed
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    ContestSummary:
      type: object
      required:
        - id
        - electionId
        - constituencyId
        - constituencyName
        - acNo
        - totalElectors
        - totalVotesPolled
        - turnoutPercentage
        - margin
        - provenance
      properties:
        id:
          type: string
          description: Internal synthetic identifier for the contest [Synthetic Identifier].
        electionId:
          type: string
          description: Synthetic foreign key referencing election event [Synthetic Identifier].
        constituencyId:
          type: string
          description: Synthetic foreign key referencing constituency [Synthetic Identifier].
          example: ac-65
        constituencyName:
          type: string
          description: Assembly Constituency name per Delimitation Order [Official Statutory Fact].
          example: Kodangal
        acNo:
          type: integer
          description: Assembly Constituency statutory number [Official Statutory Fact].
          example: 65
        totalElectors:
          type: integer
          description: Total electors on roll per ECI Form 20 [Official Statutory Fact].
          example: 245000
        totalVotesPolled:
          type: integer
          description: Total votes polled per ECI Form 20 [Official Statutory Fact].
          example: 195000
        turnoutPercentage:
          type: number
          description: Turnout percentage computed as (totalVotesPolled / totalElectors * 100) [Derived Metric].
          example: 79.59
        margin:
          type: integer
          description: Victory margin in votes computed between winner and runner-up [Derived Metric].
          example: 32532
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    CandidateResultItem:
      type: object
      required:
        - id
        - candidateName
        - party
        - votesReceived
        - rank
        - result
        - provenance
      properties:
        id:
          type: string
          description: Internal synthetic identifier for the candidature record [Synthetic Identifier].
        candidateName:
          type: string
          description: Candidate name certified on ECI Form 21E Declaration of Result [Official Statutory Fact].
          example: Anumula Revanth Reddy
        party:
          type: string
          description: Recognized party affiliation reported on Form 21E [Official Statutory Fact].
          example: INC
        partyId:
          type: string
          nullable: true
          description: Synthetic identifier for the political party entity [Synthetic Identifier].
        partyAtElection:
          type: string
          nullable: true
          description: Party name as printed on ballot paper [Official Statutory Fact].
        votesReceived:
          type: integer
          description: Total valid votes certified on ECI Form 21E [Official Statutory Fact].
          example: 107429
        voteShare:
          type: number
          nullable: true
          description: Vote share percentage computed against total valid votes polled [Derived Metric].
          example: 55.09
        rank:
          type: integer
          description: Position rank computed from descending votes received [Derived Metric].
          example: 1
        result:
          type: string
          enum: [won, lost]
          description: Statutory contest outcome certified per Form 21E [Official Statutory Fact].
          example: won
        evmVotes:
          type: integer
          nullable: true
          description: Electronic Voting Machine votes recorded per ECI Form 20 [Official Statutory Fact].
          example: 106000
        postalVotes:
          type: integer
          nullable: true
          description: Postal ballot votes counted per ECI Form 20 [Official Statutory Fact].
          example: 1429
        provenance:
          $ref: '#/components/schemas/StatutoryFactProvenance'

    ContestDetail:
      type: object
      required:
        - contest
        - candidates
        - ballotChoices
      properties:
        contest:
          type: object
          properties:
            id:
              type: string
              description: Internal synthetic identifier for the contest [Synthetic Identifier].
            electionId:
              type: string
              description: Synthetic identifier referencing election event [Synthetic Identifier].
            constituencyId:
              type: string
              description: Synthetic identifier referencing constituency [Synthetic Identifier].
            constituencyName:
              type: string
              description: Assembly Constituency name per Delimitation Order [Official Statutory Fact].
            acNo:
              type: integer
              description: Assembly Constituency statutory number [Official Statutory Fact].
            totalElectors:
              type: integer
              description: Total electors on roll per ECI Form 20 [Official Statutory Fact].
            totalVotesPolled:
              type: integer
              description: Total votes polled per ECI Form 20 [Official Statutory Fact].
            turnoutPercentage:
              type: number
              description: Turnout percentage computed as (totalVotesPolled / totalElectors * 100) [Derived Metric].
            margin:
              type: integer
              description: Victory margin in votes computed between winner and runner-up [Derived Metric].
            provenance:
              $ref: '#/components/schemas/StatutoryFactProvenance'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateResultItem'
        ballotChoices:
          type: array
          items:
            type: object
            properties:
              choiceType:
                type: string
                description: Statutory non-candidate choice (e.g. NOTA per Supreme Court ruling) [Official Statutory Fact].
                example: NOTA
              votesReceived:
                type: integer
                description: Votes polled for ballot choice per ECI Form 20 [Official Statutory Fact].
                example: 2002
        winner:
          type: object
          nullable: true
          properties:
            candidateName:
              type: string
              description: Winning candidate certified per Form 21E [Official Statutory Fact].
            party:
              type: string
              description: Party affiliation certified per Form 21E [Official Statutory Fact].
            votes:
              type: integer
              description: Total valid votes received [Official Statutory Fact].
        runnerUp:
          type: object
          nullable: true
          properties:
            candidateName:
              type: string
              description: Runner-up candidate per Form 21E [Official Statutory Fact].
            party:
              type: string
              description: Party affiliation per Form 21E [Official Statutory Fact].
            votes:
              type: integer
              description: Total valid votes received [Official Statutory Fact].

