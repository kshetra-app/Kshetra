  /api/vsaas/v1/delim/simulate/{stateCode}:
    get:
      operationId: simulateStateBoundaries
      tags:
        - Delimitation Regimes & Scenarios
      summary: Governed boundary redistribution simulation
      description: >
        Executes governed algorithmic boundary redistribution simulation (Hare-Niemeyer / Hamilton quota method) for an Indian state.
        Governed strictly by server-owned PANIN_SCENARIO provenance metadata.
        Client-supplied scenario override flags (isScenario, is_scenario, simulation) are strictly rejected with 400 SCENARIO_INPUT_FORBIDDEN.
      parameters:
        - $ref: '#/components/parameters/StateCodePathParam'
        - name: seats
          in: query
          required: false
          schema:
            type: string
          description: Target assembly seat total. Must be an integer between 10 and 10000 (ingress computational safety limit).
        - name: maxDeviation
          in: query
          required: false
          schema:
            type: string
          description: Maximum allowable population deviation percentage across constituencies.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [current, as_of, explicit, future_anticipated, scenario]
          description: Simulation regime mode.
        - name: regimeId
          in: query
          required: false
          schema:
            type: string
          description: Statutory or proposed delimitation regime identifier.
        - name: proposalId
          in: query
          required: false
          schema:
            type: string
          description: Delimitation proposal reference.
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Historical evaluation date (YYYY-MM-DD).
      responses:
        '200':
          description: Boundary redistribution simulation results with server-owned PANIN_SCENARIO provenance and statutory disclaimer.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
