        winner:
          type: object
          nullable: true
          properties:
            candidateName:
              type: string
            party:
              type: string
            votes:
              type: integer
        runnerUp:
          type: object
          nullable: true
          properties:
            candidateName:
              type: string
            party:
              type: string
            votes:
              type: integer

    # ─── CANONICAL POLITICAL ENTITIES ───
    CanonicalPersonSummary:
