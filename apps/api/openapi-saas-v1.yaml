          $ref: '#/components/schemas/StatutoryFactProvenance'

    ContestSummary:
      type: object
      required:
        - id
        - electionId
        - constituencyId
        - constituencyName
        - acNo
        - totalElectors
        - totalVotesPolled
        - turnoutPercentage
        - margin
        - provenance
      properties:
