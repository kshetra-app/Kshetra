openapi: 3.1.0
info:
  title: PanIN B2B Political SaaS & Public/Partner Developer API
  version: 1.0.0
  description: >
    Canonical machine-readable contract for the PanIN B2B Political SaaS & Public/Partner Developer API.
    Governed by Milestone W021 (Gates W021-G1 through W021-G5) under PLAN-W021-MASTER-REV-1.0.
    Provides read-only statutory factual electoral, geographical, political entity data and governed delimitation scenario simulations.
    Mixed Provenance Model: Top-level provenance certifies originating statutory authorities and legal instruments,
    while individual response properties express precise property-level classifications (Statutory Facts, Derived Metrics,
    Current-State/Temporal Affiliations, Normalized Entities, Synthetic Identifiers, and Scenario Simulations).
    All endpoints require cryptographic API-key authentication with strict tenant isolation, burst rate limiting, and durable monthly quota enforcement.
  contact:
    name: PanIN Partner Engineering Team
    url: https://kshetra.io/developers
  license:
    name: Proprietary (PanIN Institutional SaaS License)
servers:
  - url: https://api.kshetra.io
    description: Production API Gateway (Isolated Fastify SaaS Service)
  - url: http://localhost:3001
    description: Local Development Server (Fastify HTTP Listener)

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Geography
    description: Statutory geographical structures, states, Union Territories, and Assembly Constituencies.
  - name: Normalized Elections
    description: Authoritative ECI election events, assembly contests, candidate vote tallies, and margins.
  - name: Canonical Political Entities
    description: Canonical public records for political persons, recognized organizations, and sitting legislators.
  - name: Delimitation Regimes & Scenarios
    description: Statutory delimitation orders, constitutional timelines, and governed boundary redistricting simulations.
  - name: Onboarding & Key Management
    description: Partner tenant self-service registration, cryptographic API key issuance (256-bit CSPRNG Base64URL), and key revocation.
  - name: Commercial Subscriptions & Billing
    description: Commercial subscription plans, Razorpay payment orders, signature verification, and automated tier provisioning.
  - name: Usage & Telemetry
    description: Real-time API consumption metrics, monthly quota balance, and hourly usage trends from the immutable ledger.
  - name: Developer Portal & API Specs
    description: Interactive developer portal and machine-readable OpenAPI specifications (JSON/YAML).

paths:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. GEOGRAPHY & CONSTITUENCY DATA FAMILY
  # ════════════════════════════════════════════════════════════════════════════

  /api/vsaas/v1/geo/states:
    get:
      operationId: listStates
      tags:
        - Geography
      summary: List all states and Union Territories
      description: Returns all supported Indian states and Union Territories with statutory seat totals, loaded constituency counts, and gazette citations.
      responses:
        '200':
          description: Successful retrieval of states list.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
            x-monthly-quota-limit:
              $ref: '#/components/headers/XMonthlyQuotaLimit'
            x-monthly-quota-remaining:
              $ref: '#/components/headers/XMonthlyQuotaRemaining'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - states
                          - total
                        properties:
                          total:
                            type: integer
                            example: 1
                          states:
                            type: array
                            items:
                              $ref: '#/components/schemas/StateListItem'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/geo/states/{stateCode}:
    get:
      operationId: getStateByCode
      tags:
        - Geography
      summary: Get state metadata by code
      description: Returns single state metadata, assembly seat total, loaded constituencies, and spatial boundary availability. Accepts 2-letter state code (e.g. TS, TG).
      parameters:
        - $ref: '#/components/parameters/StateCodePathParam'
      responses:
        '200':
          description: State details found.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StateDetail'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/geo/states/{stateCode}/constituencies:
    get:
      operationId: listStateConstituencies
      tags:
        - Geography
      summary: List assembly constituencies for a state
      description: Returns complete roster of assembly constituencies for a state with reservation status and district names.
      parameters:
        - $ref: '#/components/parameters/StateCodePathParam'
      responses:
        '200':
          description: List of assembly constituencies.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - stateCode
                          - stateName
                          - count
                          - constituencies
                        properties:
                          stateCode:
                            type: string
                            example: TS
                          stateName:
                            type: string
                            example: Telangana
                          count:
                            type: integer
                            example: 119
                          constituencies:
                            type: array
                            items:
                              $ref: '#/components/schemas/ConstituencySummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/geo/states/{stateCode}/constituencies/{acNo}:
    get:
      operationId: getConstituencyByAcNo
      tags:
        - Geography
      summary: Get single constituency details by AC number
      description: Returns high-precision statutory details for an assembly constituency identified by state code and constituency number (acNo >= 1).
      parameters:
        - $ref: '#/components/parameters/StateCodePathParam'
        - $ref: '#/components/parameters/AcNoPathParam'
      responses:
        '200':
          description: Constituency details found.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConstituencyDetail'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ════════════════════════════════════════════════════════════════════════════
  # 2. NORMALIZED ELECTIONS DATA FAMILY
  # ════════════════════════════════════════════════════════════════════════════

  /api/vsaas/v1/elections:
    get:
      operationId: listElectionEvents
      tags:
        - Normalized Elections
      summary: List macro election events
      description: Query macro election events filtered by state, year, and election type with pagination.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
          description: Two-letter state code filter (e.g. TG, TS).
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 1947
            maximum: 2100
          description: Election year filter.
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [assembly, parliamentary, local_body, by_election]
          description: Classification type of the election.
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/OffsetQueryParam'
      responses:
        '200':
          description: List of election events with statutory provenance.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - total
                          - limit
                          - offset
                          - events
                        properties:
                          total:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          offset:
                            type: integer
                            example: 0
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/ElectionEvent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/elections/{id}:
    get:
      operationId: getElectionEventById
      tags:
        - Normalized Elections
      summary: Get election event details
      description: Returns macro turnout totals, registered voters, votes polled, and gazette citations for a specific election event.
      parameters:
        - $ref: '#/components/parameters/EntityIdPathParam'
      responses:
        '200':
          description: Election event details.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ElectionEventDetail'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/elections/{id}/contests:
    get:
      operationId: listElectionContests
      tags:
        - Normalized Elections
      summary: List assembly contests in an election event
      description: Returns assembly constituency contests within an election event, including winner, runner-up, and turnout metrics.
      parameters:
        - $ref: '#/components/parameters/EntityIdPathParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text search on constituency name.
        - name: party
          in: query
          required: false
          schema:
            type: string
          description: Filter by winning political party code (e.g. INC, BRS, BJP).
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/OffsetQueryParam'
      responses:
        '200':
          description: Contests list with statutory provenance.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - electionId
                          - total
                          - limit
                          - offset
                          - contests
                        properties:
                          electionId:
                            type: string
                          total:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
                          contests:
                            type: array
                            items:
                              $ref: '#/components/schemas/ContestSummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/elections/{id}/contests/{constituencyId}:
    get:
      operationId: getContestDetail
      tags:
        - Normalized Elections
      summary: Get detailed contest results and candidate breakdown
      description: Returns full statutory contest breakdown from ECI Form 20 and Form 21E, including candidate rankings, EVM/postal votes, vote shares, victory margins, and ballot choices (NOTA).
      parameters:
        - $ref: '#/components/parameters/EntityIdPathParam'
        - name: constituencyId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Constituency identifier (e.g. ac-65, TS-AC-065).
      responses:
        '200':
          description: Full contest details with candidate results.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContestDetail'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ════════════════════════════════════════════════════════════════════════════
  # 3. CANONICAL POLITICAL ENTITY FAMILY
  # ════════════════════════════════════════════════════════════════════════════

  /api/vsaas/v1/entities/search:
    get:
      operationId: searchPoliticalEntities
      tags:
        - Canonical Political Entities
      summary: Search canonical political persons and organizations
      description: Search canonical political persons and recognized political organizations. Zero citizen personal data (PII) is exposed.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Search term matching person name, aliases, or party name.
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [person, organization]
          description: Scope search strictly to persons or organizations.
        - name: state
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
          description: Two-letter state code filter.
        - name: role
          in: query
          required: false
          schema:
            type: string
          description: Filter by political role (e.g. MLA, MP).
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/OffsetQueryParam'
      responses:
        '200':
          description: Search results containing persons and organizations.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - total
                          - limit
                          - offset
                          - persons
                          - organizations
                        properties:
                          total:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
                          persons:
                            type: array
                            items:
                              $ref: '#/components/schemas/CanonicalPersonSummary'
                          organizations:
                            type: array
                            items:
                              $ref: '#/components/schemas/CanonicalOrgSummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/entities/persons/{id}:
    get:
      operationId: getPersonById
      tags:
        - Canonical Political Entities
      summary: Get canonical profile of a political person
      description: Returns the public gazetted profile of an elected representative or candidate, including official identifiers (ECI, Sansad). Contains zero private citizen contact details.
      parameters:
        - $ref: '#/components/parameters/EntityIdPathParam'
      responses:
        '200':
          description: Canonical person profile found.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CanonicalPersonProfile'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/entities/organizations/{id}:
    get:
      operationId: getOrganizationById
      tags:
        - Canonical Political Entities
      summary: Get political organization profile
      description: Returns recognized political party or alliance details, registration tier (national/state/unrecognized), and official election symbol metadata.
      parameters:
        - $ref: '#/components/parameters/EntityIdPathParam'
      responses:
        '200':
          description: Political organization found.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CanonicalOrgProfile'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/vsaas/v1/entities/legislators:
    get:
      operationId: listCurrentLegislators
      tags:
        - Canonical Political Entities
      summary: Roster of current gazetted legislators
      description: Returns roster of sitting elected legislators with tenure dates, jurisdictions, and party affiliations from official legislative secretariat gazettes.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
          description: Two-letter state code filter.
        - name: house
          in: query
          required: false
          schema:
            type: string
            enum: [assembly, parliament]
          description: Legislative house (assembly or parliament).
        - name: currentOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Filter for currently active tenures.
      responses:
        '200':
          description: Legislator roster retrieved.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
              $ref: '#/components/headers/XRatelimitLimit'
            x-ratelimit-remaining:
              $ref: '#/components/headers/XRatelimitRemaining'
            x-ratelimit-reset:
              $ref: '#/components/headers/XRatelimitReset'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - count
                          - legislators
                        properties:
                          count:
                            type: integer
                          legislators:
                            type: array
                            items:
                              $ref: '#/components/schemas/LegislatorTenureItem'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  # ════════════════════════════════════════════════════════════════════════════
  # 4. DELIMITATION REGIMES & GOVERNED SCENARIOS
  # ════════════════════════════════════════════════════════════════════════════

  /api/vsaas/v1/delim/regimes:
    get:
      operationId: getDelimitationRegimes
      tags:
        - Delimitation Regimes & Scenarios
      summary: Delimitation statutory orders and legal regimes
      description: Returns operative legal status under the 2008 Delimitation Order, constitutional freeze information (Article 82 & 170, 84th Constitutional Amendment), and statutory timeline events.
      responses:
        '200':
          description: Delimitation regimes and constitutional timeline.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-response-time:
              $ref: '#/components/headers/XResponseTime'
            x-ratelimit-limit:
