        - party
        - votesReceived
        - rank
        - result
        - provenance
      properties:
        id:
          type: string
        candidateName:
          type: string
          example: Anumula Revanth Reddy
        party:
          type: string
          example: INC
        partyId:
          type: string
          nullable: true
        partyAtElection:
          type: string
          nullable: true
        votesReceived:
          type: integer
          example: 107429
        voteShare:
          type: number
          nullable: true
